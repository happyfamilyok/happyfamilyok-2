<VirtualHost *:80>
    ServerName happyfamilyok.com
    ServerAlias www.happyfamilyok.com
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:8924/
    ProxyPassReverse / http://127.0.0.1:8924/
    ErrorLog ${APACHE_LOG_DIR}/happyfamily-anubis-error.log
    CustomLog ${APACHE_LOG_DIR}/happyfamily-anubis-access.log combined
</VirtualHost>
