[package]
name = "orbit-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["MediaStreamTrack", "RtcTrackEvent", "RtcRtpSender", "RtcRtpTransceiver", "RtcRtpTransceiverInit", "RtcRtpTransceiverDirection", "WebSocket", "MessageEvent", "Event", "ErrorEvent", "RtcPeerConnection", "RtcConfiguration", "RtcIceServer", "RtcDataChannel", "RtcDataChannelEvent", "RtcDataChannelState", "RtcPeerConnectionIceEvent", "RtcIceCandidate", "RtcIceCandidateInit", "RtcSessionDescriptionInit", "RtcSdpType", "RtcPeerConnectionState"] }
