# Include inside the existing HTTPS virtual host, BEFORE its catch-all ProxyPass.
# Dedicated WebSocket mapping is required by this server's Apache 2.4.29.
ProxyPass "/orbit/ws" "ws://127.0.0.1:8980/ws" timeout=120
ProxyPassReverse "/orbit/ws" "ws://127.0.0.1:8980/ws"
ProxyPass "/orbit/" "http://127.0.0.1:8980/" timeout=120
ProxyPassReverse "/orbit/" "http://127.0.0.1:8980/"
